name: Draw Keymap
on: [push]

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Draw keymap
        uses: caksoylar/keymap-drawer-action@v1
        with:
          keymap_path: "config/LiNEA40.keymap" # 大文字に統一してあります
          output_path: "keymap.svg"

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f keymap.svg ]; then
            git add keymap.svg
            git diff-index --quiet HEAD || (git commit -m "Update keymap diagram" && git push)
          fi
